<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>NexIDE preview</title>
<link rel="icon" href="data:,">

<!--
  Live-preview host. Loaded in an iframe with sandbox="allow-scripts …" (no
  allow-same-origin), so it runs in an opaque origin and cannot touch the app's
  storage or session. It is served with its own permissive CSP (see vercel.json)
  so user code can use inline scripts, CDN libraries and fetch, while the app
  itself keeps a strict policy.
-->
<script>
  (function () {
    window.addEventListener('message', function onRender(event) {
      if (event.source !== window.parent) return;
      var data = event.data;
      if (!data || data.__nexidePreview !== true || typeof data.html !== 'string') return;
      window.removeEventListener('message', onRender);
      document.open();
      document.write(data.html);
      document.close();
    });
    window.parent.postMessage({ __nexidePreviewReady: true }, '*');
  })();
</script>
</head>
<body></body>
</html>
