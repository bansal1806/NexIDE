name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Build + browser E2E (production bundle, real vercel.json headers)
        run: npm run test:e2e
        env:
          # Google Chrome is preinstalled on GitHub's Ubuntu runners
          E2E_BROWSER: chrome
